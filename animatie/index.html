<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eén order door het proces · Kroon Kozijn</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#1c4e5c;--dark:#2a768c;--brand:#3391ab;--light:#f5f9fb;--acc:#e4a11b;--ink:#202020;--soft:#5f6b73;--red:#c0392b;--green:#1e8a4c;--line:#dce6ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0f2a32;overflow:hidden;font-family:Poppins,system-ui,sans-serif}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:relative;width:1920px;height:1080px;background:#fff;transform-origin:center center;overflow:hidden}
.abs{position:absolute}
/* kop */
#head{left:80px;top:56px;right:80px;height:120px}
#mode{display:inline-block;padding:8px 18px;border-radius:999px;font-weight:600;font-size:22px;letter-spacing:.04em}
#title{font-size:46px;font-weight:600;color:var(--deep);margin-top:14px;line-height:1.1}
#caption{left:80px;top:196px;width:1300px;font-size:28px;color:var(--ink);line-height:1.35;min-height:80px}
#logo{right:80px;top:56px;height:44px;opacity:.9}
/* systemen */
.lane{top:480px;width:400px;height:290px;border-radius:22px;background:var(--light);border:2px solid var(--line)}
.lane h3{margin:0;padding:20px 24px 4px;font-size:26px;color:var(--deep);font-weight:600}
.lane small{display:block;padding:0 24px;font-size:18px;color:var(--soft)}
.lane .body{position:absolute;left:24px;right:24px;top:90px;bottom:16px}
/* order-token */
#token{width:250px;height:118px;border-radius:16px;background:#fff;border:3px solid var(--deep);box-shadow:0 10px 30px rgba(28,78,92,.18);padding:14px 18px;z-index:20}
#token b{display:block;font-size:22px;color:var(--deep)}
#token span{font-size:17px;color:var(--soft)}
#kkn{position:absolute;right:-14px;top:-18px;background:var(--acc);color:#fff;font-weight:700;font-size:18px;padding:5px 12px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.chip{height:32px;padding:0 10px;border-radius:8px;font-size:15px;font-weight:500;display:flex;align-items:center;white-space:nowrap;z-index:15}
.flow{height:4px;border-radius:2px;z-index:5}
/* meters */
.gauge{width:150px}
.gauge .lab{font-size:16px;color:var(--soft);margin-bottom:6px}
.gauge .tube{height:96px;border-radius:12px;background:#e9eff2;position:relative;overflow:hidden}
.gauge .fill{position:absolute;left:0;right:0;bottom:0;border-radius:12px}
.gauge .v{font-size:22px;font-weight:600;margin-top:6px}
/* onderste paneel */
#stats{left:80px;top:810px;width:1760px;height:250px}
.stat{position:absolute;top:0;width:410px;height:190px;border-radius:18px;padding:22px 26px;background:#fff;border:2px solid var(--line)}
.stat .l{font-size:20px;color:var(--soft)}
.stat .v{font-size:56px;font-weight:700;margin-top:8px;line-height:1}
.stat .s{font-size:18px;color:var(--soft);margin-top:10px}
#costpanel{left:80px;top:800px;width:1760px;height:250px}
.seg{position:absolute;top:66px;height:60px}
.seglab{position:absolute;top:136px;font-size:18px;color:var(--soft);white-space:nowrap}
/* volle schermen */
.full{inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 140px;z-index:50}
.full h1{font-size:84px;line-height:1.05;margin:0;font-weight:600}
.full p{font-size:34px;margin:24px 0 0;font-weight:300}
.cmp{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:0;margin-top:40px;font-size:30px;border-radius:20px;overflow:hidden;border:2px solid var(--line)}
.cmp div{padding:20px 28px;border-bottom:2px solid var(--line)}
.cmp .h{background:var(--deep);color:#fff;font-weight:600;font-size:24px;letter-spacing:.03em}
.cmp .k{font-weight:600;color:var(--deep);background:var(--light)}
.cmp .a{color:var(--red)}.cmp .b{color:var(--green);font-weight:600}
/* bediening */
#ctl{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:rgba(17,24,39,.85);color:#fff;border-radius:999px;padding:8px 14px;font:500 14px Poppins,sans-serif;z-index:100;opacity:.2;transition:opacity .2s}
#ctl:hover{opacity:1}
#ctl button{all:unset;cursor:pointer;padding:4px 10px;border-radius:999px}#ctl button:hover{background:rgba(255,255,255,.15)}
#bar{width:320px;height:6px;background:rgba(255,255,255,.25);border-radius:3px;cursor:pointer;position:relative}#bar i{position:absolute;left:0;top:0;bottom:0;background:#e4a11b;border-radius:3px}
body.rec #ctl{display:none}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="head" class="abs"><span id="mode"></span><div id="title"></div></div>
  <img id="logo" class="abs" alt="" src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2070%2033%27%3E%3Cpath%20fill%3D%27%231c4e5c%27%20d%3D%27M29.7853854%2C0.25841851%20L33.9434434%2C5.27028245%20C34.0351652%2C5.38125458%2034.0861218%2C5.52166831%2034.0861218%2C5.6666115%20L34.0861218%2C32.0270229%20C34.0861218%2C32.3610716%2033.8154857%2C32.6305754%2033.4825693%2C32.6305754%20L27.5353688%2C32.6305754%20C27.3643811%2C32.6305754%2027.2035848%2C32.5569714%2027.0892155%2C32.4301461%20L16.6997326%2C20.0488266%20C16.4347583%2C19.7328957%2015.9863403%2C19.6060704%2015.6126586%2C19.7804552%20C15.0464742%2C20.0431647%2014.9196489%2C20.7463657%2015.2910659%2C21.1891219%20L19.4445943%2C26.1387055%20C19.6314352%2C26.3617822%2019.6325675%2C26.6879044%2019.4457267%2C26.9132457%20L14.8777513%2C32.4131606%20C14.763382%2C32.5513096%2014.5923944%2C32.6305754%2014.4134801%2C32.6305754%20L0.605375983%2C32.6305754%20C0.0924129542%2C32.6305754%20-0.187282119%2C32.0326847%200.142237178%2C31.6386204%20L13.0625642%2C16.2168908%20C13.2482727%2C15.9949466%2013.2505374%2C15.6710891%2013.0682261%2C15.4468801%20L1.31310643%2C1.00691423%20C0.992646084%2C0.613982287%201.26894405%2C0.0262829234%201.77511287%2C0.0206091106%20L15.1800937%2C0.0206091106%20C15.3601404%2C0.0194887111%2015.5322604%2C0.0987545213%2015.647762%2C0.236903505%20L27.926036%2C14.9101373%20C28.1910103%2C15.2260682%2028.6394283%2C15.3528935%2029.01311%2C15.1785087%20C29.5792943%2C14.9157992%2029.7061196%2C14.2125982%2029.3347027%2C13.769842%20L22.3661056%2C5.46504987%20C22.2755161%2C5.35747484%2022.2256919%2C5.22045823%2022.2245595%2C5.08004451%20L22.2019121%2C0.667203617%20C22.1996474%2C0.315036946%2022.4850043%2C0.0285476608%2022.837171%2C0.0285476608%20L29.2962022%2C0.0285476608%20C29.4853077%2C0.0285476608%2029.664222%2C0.112342946%2029.7853854%2C0.25841851%27/%3E%3Cpath%20fill%3D%27%231c4e5c%27%20d%3D%27M40.2146146%2C0.2378094%20L36.0565566%2C5.24967334%20C35.9648348%2C5.36064547%2035.9138782%2C5.50105919%2035.9138782%2C5.64600239%20L35.9138782%2C32.0064137%20C35.9138782%2C32.3404625%2036.1845143%2C32.6099663%2036.5174307%2C32.6099663%20L42.4646312%2C32.6099663%20C42.6356189%2C32.6099663%2042.7964152%2C32.5363623%2042.9107845%2C32.409537%20L53.3002674%2C20.0282175%20C53.5652417%2C19.7122866%2054.0136597%2C19.5854613%2054.3873414%2C19.7598461%20C54.9535258%2C20.0225556%2055.0803511%2C20.7257566%2054.7089341%2C21.1685128%20L50.5554057%2C26.1180964%20C50.3685648%2C26.3411731%2050.3674325%2C26.6672952%2050.5542733%2C26.8926366%20L55.1222487%2C32.3925515%20C55.236618%2C32.5307005%2055.4076056%2C32.6099663%2055.5865199%2C32.6099663%20L69.394624%2C32.6099663%20C69.907587%2C32.6099663%2070.1872821%2C32.0120756%2069.8577628%2C31.6180113%20L56.9374358%2C16.1962817%20C56.7517273%2C15.9743375%2056.7494626%2C15.65048%2056.9317739%2C15.426271%20L68.6868936%2C0.986305121%20C69.0073539%2C0.593373177%2068.7310559%2C0.00567381275%2068.2248871%2C0%20L54.8199063%2C0%20C54.6398596%2C-0.00112039955%2054.4677396%2C0.0781454106%2054.352238%2C0.216294394%20L42.073964%2C14.8895282%20C41.8089897%2C15.2054591%2041.3605717%2C15.3322844%2040.98689%2C15.1578996%20C40.4207057%2C14.8951901%2040.2938804%2C14.1919891%2040.6652973%2C13.7492329%20L47.6338944%2C5.44444076%20C47.7244839%2C5.33686573%2047.7743081%2C5.19984912%2047.7754405%2C5.0594354%20L47.7980879%2C0.646594506%20C47.8003526%2C0.294427835%2047.5149957%2C0.00793855018%2047.162829%2C0.00793855018%20L40.7037978%2C0.00793855018%20C40.5146923%2C0.00793855018%2040.335778%2C0.0917338352%2040.2146146%2C0.2378094%27/%3E%3C/svg%3E">
  <div id="caption" class="abs"></div>
  <div id="lanes"></div>
  <div id="fx"></div>
  <div id="token" class="abs"><b>Fam. de Vries</b><span id="tokref">Offerte AR-2026-118 · € 9.950</span><div id="kkn">KKN 140231</div></div>
  <div id="stats" class="abs"></div>
  <div id="costpanel" class="abs"></div>
  <div id="full" class="abs full"></div>
</div></div>
<div id="ctl"><button id="pp">❚❚</button><div id="bar"><i></i></div><span id="tm">0:00</span><button id="fs">Volledig scherm</button></div>
<script>
// ---------- tijdlijn (seconden) ----------
const W = 1920, LANEX = [80, 560, 1040, 1520], LANE_W = 400, STEP = 4.2;
const LANES = [['Ramasoft', 'calculatie en werkvoorbereiding'], ['Exact Bouw · fabriek', 'KK Nederland B.V.'], ['Exact Bouw · vestiging', 'Arnhem: project en facturen'], ['CRM-KKN', 'klant, planning en status']];
const T_INTRO = 6, T_A = T_INTRO, NA = 7, T_MID = T_A + NA * STEP, T_B = T_MID + 4.5, NB = 7, T_SUM = T_B + NB * STEP, T_END = T_SUM + 12;
const LINES = [['Profiel wit', 'v'], ['Profiel antraciet', 'v'], ['Beslag', 'v'], ['Glas HR++', 'i'], ['Hor', 'i'], ['Rooster', 'i'], ['Kleinmateriaal', 'v']];
const A = [ // vandaag
  { lane: 0, cap: 'De verkoper maakt de offerte in Ramasoft: AR-2026-118, € 9.950.' },
  { lane: 3, cap: 'De klant gaat akkoord. Iemand zet dat <b>met de hand</b> in het CRM.', hand: 1 },
  { lane: 1, cap: 'Werkvoorbereiding geeft vrij voor productie. Maar niet alle regels komen aan: <b>de roosters vallen weg</b>.', lines: 'drop' },
  { lane: 1, cap: 'Glas, horren en roosters worden besteld <b>buiten Exact om</b>, zonder ordernummer.', buy: 'loose' },
  { lane: 1, cap: 'Materiaal gaat de fabriek uit, maar wordt <b>niet afgeboekt</b>. Het magazijn raakt leeg, de administratie niet.', stock: 'drift' },
  { lane: 2, cap: 'Montage gedaan. De factuur maakt de administratie <b>met de hand</b>. Is er al betaald? Even navragen.', hand: 2, inv: 'hand' },
  { lane: 2, cap: 'En dan de vraag: <b>wat heeft deze order gekost?</b> Dat weet niemand precies.', cost: 'unknown' },
];
const B = [ // met koppeling
  { lane: 0, cap: 'Dezelfde offerte in Ramasoft. Het project staat automatisch in Exact.', auto: [0, 2] },
  { lane: 3, cap: 'Klant akkoord in het CRM. Exact weet het meteen: het project staat op opdracht.', auto: [3, 2] },
  { lane: 1, cap: 'Vrijgeven voor productie: het <b>KKN-nummer</b> ontstaat. <b>Alle regels</b> komen aan, ook horren en roosters.', lines: 'all', kkn: 1 },
  { lane: 1, cap: 'Glas, horren en roosters: inkooporders <b>op het KKN</b>, in Exact.', buy: 'kkn' },
  { lane: 1, cap: 'Gereedmelding: het materiaal wordt <b>automatisch afgeboekt</b>. Magazijn en administratie blijven gelijk.', stock: 'match' },
  { lane: 2, cap: 'Montage en restwerk op het KKN. De factuur gaat vanzelf, en het CRM ziet: <b>30% betaald</b>.', inv: 'auto' },
  { lane: 2, cap: 'Nu staat er per order <b>wat hij echt kostte</b>: fabriek en vestiging samen, via één nummer.', cost: 'known' },
];
const COST = [['Inkoop op order', 1474, '#1c4e5c'], ['Materiaal uit voorraad', 1319, '#2a768c'], ['Fabrieksuren', 1344, '#3391ab'], ['Montage en restwerk', 2330, '#9aa6ab']];

const $ = (s) => document.querySelector(s);
const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = (x) => Math.max(0, Math.min(1, x));
const eur = (n) => '€ ' + Math.round(n).toLocaleString('nl-NL');
const set = (el, css) => { for (const k in css) el.style[k] = css[k]; };

// vaste elementen
$('#lanes').innerHTML = LANES.map(([h, s], i) => `<div class="abs lane" style="left:${LANEX[i]}px"><h3>${h}</h3><small>${s}</small><div class="body" id="lb${i}"></div></div>`).join('');
const fx = $('#fx');
const mk = (cls, html = '') => { const d = document.createElement('div'); d.className = 'abs ' + cls; d.innerHTML = html; fx.appendChild(d); return d; };
const chips = LINES.map(([n]) => mk('chip', n));
const flows = [0, 1, 2, 3].map(() => mk('flow'));
const gAdm = mk('gauge', '<div class="lab">Administratie</div><div class="tube"><div class="fill"></div></div><div class="v"></div>');
const gReal = mk('gauge', '<div class="lab">Magazijn</div><div class="tube"><div class="fill"></div></div><div class="v"></div>');
const inv = mk('chip'); const pay = mk('chip');
const crmBadge = mk('chip');

function phase(t) {
  if (t < T_INTRO) return { s: 'intro', k: t / T_INTRO };
  if (t < T_MID) { const i = Math.min(NA - 1, Math.floor((t - T_A) / STEP)); return { s: 'A', i, p: (t - T_A - i * STEP) / STEP }; }
  if (t < T_B) return { s: 'mid', k: (t - T_MID) / (T_B - T_MID) };
  if (t < T_SUM) { const i = Math.min(NB - 1, Math.floor((t - T_B) / STEP)); return { s: 'B', i, p: (t - T_B - i * STEP) / STEP }; }
  return { s: 'sum', k: (t - T_SUM) / (T_END - T_SUM) };
}
function laneCenter(i) { return LANEX[i] + LANE_W / 2; }

function draw(t) {
  const ph = phase(t);
  const full = $('#full');
  // ---------- volle schermen
  if (ph.s === 'intro' || ph.s === 'mid' || ph.s === 'sum') {
    const fade = ph.s === 'sum' ? clamp(ph.k * 6) : clamp(Math.min(ph.k * 5, (1 - ph.k) * 5));
    full.style.display = 'flex'; full.style.opacity = 1;
    if (ph.s === 'intro') { full.style.background = '#1c4e5c'; full.innerHTML = `<div style="opacity:${fade};transform:translateY(${(1 - fade) * 20}px)"><div style="color:#e4a11b;font-weight:600;font-size:26px;letter-spacing:.12em">KROON KOZIJN NEDERLAND</div><h1 style="color:#fff;margin-top:20px">Eén order door het proces</h1><p style="color:#cfe3ea">Fam. de Vries in Renkum · offerte AR-2026-118 · € 9.950<br>Eerst zoals het vandaag gaat. Daarna met de koppeling.</p></div>`; }
    else if (ph.s === 'mid') { full.style.background = '#1c4e5c'; full.innerHTML = `<div style="opacity:${fade}"><div style="color:#e4a11b;font-weight:600;font-size:26px;letter-spacing:.12em">EN NU MET DE KOPPELING</div><h1 style="color:#fff;margin-top:20px">Eén nummer dat overal meegaat:<br>het KKN</h1><p style="color:#cfe3ea">Ramasoft, Exact Bouw en het CRM praten met elkaar.</p></div>`; }
    else {
      full.style.background = '#fff';
      const rows = [['Kostprijs per order', 'onbekend', 'per order, fabriek + vestiging'], ['Regels naar de boekhouding', 'roosters vallen weg', 'alles, ook horren en roosters'], ['Inkoop', 'zonder ordernummer', 'op het KKN'], ['Voorraad', 'tekort pas bij de telling', 'klopt elke week'], ['Overtikken tussen systemen', 'bij elke stap', 'niet meer'], ['Betaald of niet?', 'navragen', 'zichtbaar in het CRM']];
      full.innerHTML = `<div style="opacity:${fade}"><div style="color:#e4a11b;font-weight:600;font-size:26px;letter-spacing:.12em">WAT DE KOPPELING OPLEVERT</div><h1 style="color:#1c4e5c;margin-top:14px;font-size:64px">Grip op kostprijs, voorraad en onderhanden werk</h1>
      <div class="cmp"><div class="h">&nbsp;</div><div class="h">VANDAAG</div><div class="h">MET KOPPELING</div>${rows.map((r, i) => { const v = clamp(ph.k * 9 - i * 0.6); return `<div class="k" style="opacity:${v}">${r[0]}</div><div class="a" style="opacity:${v}">${r[1]}</div><div class="b" style="opacity:${v}">${r[2]}</div>`; }).join('')}</div>
      <p style="color:#5f6b73;font-size:26px;opacity:${clamp(ph.k * 6 - 4)}">Weekendpilot met Arnhem op 12–13 december · alle vestigingen live op 4 januari</p></div>`;
    }
    return;
  }
  full.style.display = 'none';
  const today = ph.s === 'A', S = today ? A : B, st = S[ph.i], p = ph.p;
  // kop
  const mode = $('#mode');
  mode.textContent = today ? 'VANDAAG' : 'MET KOPPELING'; set(mode, { background: today ? '#fde8e6' : '#e3f4e8', color: today ? '#c0392b' : '#1e8a4c' });
  $('#title').textContent = `Stap ${ph.i + 1} van 7`;
  const capFade = clamp(p * 8);
  $('#caption').innerHTML = `<span style="opacity:${capFade}">${st.cap}</span>`;
  // token: van vorige naar huidige baan
  const prev = ph.i ? S[ph.i - 1].lane : 0, mv = ease(clamp(p * 2.2));
  const x = laneCenter(prev) + (laneCenter(st.lane) - laneCenter(prev)) * mv - 125;
  set($('#token'), { left: x + 'px', top: '310px' });
  const hasKkn = !today && (ph.i > 2 || (ph.i === 2 && p > .25));
  $('#kkn').style.display = hasKkn ? 'block' : 'none';
  $('#tokref').textContent = hasKkn ? 'AR-2026-118 · € 9.950' : 'Offerte AR-2026-118 · € 9.950';
  // stromen tussen systemen (met koppeling)
  flows.forEach((f) => (f.style.display = 'none'));
  const flowLine = (k, a, b, color, show) => { const f = flows[k]; if (!show) return; const x1 = Math.min(laneCenter(a), laneCenter(b)), x2 = Math.max(laneCenter(a), laneCenter(b)); set(f, { display: 'block', left: x1 + 'px', width: (x2 - x1) * clamp(show) + 'px', top: (446 + k * 8) + 'px', background: color }); };
  if (!today) { flowLine(0, 0, 2, '#3391ab', ph.i >= 1 ? 1 : ph.i === 0 ? clamp(p * 3 - .6) : 0); flowLine(1, 2, 3, '#3391ab', ph.i >= 2 ? 1 : ph.i === 1 ? clamp(p * 3 - .6) : 0); flowLine(2, 0, 1, '#e4a11b', ph.i >= 3 ? 1 : ph.i === 2 ? clamp(p * 3 - .5) : 0); flowLine(3, 1, 3, '#e4a11b', ph.i >= 3 ? 1 : ph.i === 2 ? clamp(p * 3 - 1) : 0); }

  // stuklijstregels
  const lineStep = 2, linesP = ph.i < lineStep ? -1 : ph.i === lineStep ? p : 1;
  chips.forEach((c, k) => {
    if (linesP < 0) { c.style.display = 'none'; return; }
    const local = ease(clamp(linesP * 2 - k * 0.09));
    const tx = LANEX[1] + 24 + (k % 2) * 178, ty = 572 + Math.floor(k / 2) * 44;
    const sx = LANEX[0] + 40, sy = 600;
    let X = sx + (tx - sx) * local, Y = sy + (ty - sy) * local, op = 1, bg = '#fff', col = '#1c4e5c', bd = '#3391ab';
    const isRooster = LINES[k][0] === 'Rooster';
    if (today && isRooster && local > .55) { const d = clamp((local - .55) / .45); Y += d * 200; op = 1 - d; bg = '#fde8e6'; col = '#c0392b'; bd = '#c0392b'; }
    if (!today && local >= 1) { bg = '#e3f4e8'; col = '#1e8a4c'; bd = '#1e8a4c'; }
    set(c, { display: 'flex', left: X + 'px', top: Y + 'px', opacity: op, background: bg, color: col, border: '2px solid ' + bd });
  });
  // inkoop: de orderinkoopregels krijgen hun inkoopstatus
  const buyP = ph.i < 3 ? -1 : ph.i === 3 ? p : 1;
  chips.forEach((c, k) => {
    const [n, kind] = LINES[k]; c.innerHTML = n;
    if (buyP < 0 || kind !== 'i' || c.style.display === 'none') return;
    const on = clamp(buyP * 3 - k * .2 + .6);
    if (on <= 0) return;
    if (today) { if (n === 'Rooster') return; c.innerHTML = n + ' · <b>&nbsp;zonder nr.</b>'; set(c, { background: '#fde8e6', color: '#c0392b', border: '2px solid #c0392b' }); }
    else { c.innerHTML = n + ' · <b>&nbsp;IO op KKN</b>'; set(c, { background: '#e3f4e8', color: '#1e8a4c', border: '2px solid #1e8a4c' }); }
  });
  // voorraadmeters (stap 5 en verder)
  const stP = ph.i < 4 ? -1 : ph.i === 4 ? p : 1;
  [gAdm, gReal].forEach((g, k) => {
    if (stP < 0 || ph.i > 4) { g.style.display = 'none'; return; }
    const drop = ease(clamp(stP * 1.6 - .2));
    const adm = today ? 1240 : 1240 - 56 * drop, real = 1240 - 56 * drop;
    const v = k === 0 ? adm : real, h = (v - 1000) / 300 * 100;
    const bad = today && drop > .3;
    set(g, { display: 'block', left: (LANEX[1] + 30 + k * 176) + 'px', top: '552px', zIndex: 25, background: '#fff', padding: '8px', borderRadius: '14px' });
    set(g.querySelector('.fill'), { height: h + '%', background: bad && k === 1 ? '#c0392b' : bad ? '#e4a11b' : '#3391ab' });
    g.querySelector('.v').innerHTML = Math.round(v).toLocaleString('nl-NL') + ' m' + (bad && k === 0 ? ' <span style="color:#c0392b;font-size:16px">klopt niet</span>' : !today && drop > .9 && k === 0 ? ' <span style="color:#1e8a4c;font-size:16px">gelijk</span>' : '');
  });
  if (ph.i === 4) chips.forEach((c) => (c.style.opacity = c.style.opacity * .25));
  if (ph.i >= 5) chips.forEach((c) => (c.style.opacity = c.style.opacity * .35));
  // factuur en betaling (stap 6+)
  const invP = ph.i < 5 ? -1 : ph.i === 5 ? p : 1;
  inv.style.display = pay.style.display = crmBadge.style.display = 'none';
  if (invP >= 0) {
    inv.innerHTML = today ? '✍ Factuur 30% met de hand' : 'Factuur 30% automatisch';
    set(inv, { display: 'flex', left: (LANEX[2] + 24) + 'px', top: '630px', opacity: clamp(invP * 3 - .6), background: today ? '#fde8e6' : '#e3f4e8', color: today ? '#c0392b' : '#1e8a4c', border: '2px solid ' + (today ? '#c0392b' : '#1e8a4c') });
    const pp = clamp(invP * 3 - 1.4);
    pay.innerHTML = today ? 'Betaald? <b>&nbsp;onbekend</b>' : '30% betaald ✓';
    set(pay, { display: 'flex', left: (LANEX[3] + 24) + 'px', top: '630px', opacity: pp, background: today ? '#fff' : '#1e8a4c', color: today ? '#c0392b' : '#fff', border: '2px solid ' + (today ? '#c0392b' : '#1e8a4c') });
  }
  if (!today && ph.i >= 2) { crmBadge.innerHTML = ph.i >= 4 ? 'KKN 140231 · Gereed voor levering' : 'KKN 140231 · In productie'; set(crmBadge, { display: 'flex', left: (LANEX[3] + 24) + 'px', top: '584px', opacity: ph.i === 2 ? clamp(p * 3 - 1) : 1, background: '#fff8e6', color: '#1c4e5c', border: '2px solid #e4a11b', fontSize: '15px' }); }
  if (today && ph.i >= 1) { crmBadge.innerHTML = 'Fabriek: <b>&nbsp;onbekend</b>'; set(crmBadge, { display: 'flex', left: (LANEX[3] + 24) + 'px', top: '584px', opacity: ph.i === 1 ? clamp(p * 3 - 1) : 1, background: '#fff', color: '#c0392b', border: '2px dashed #c0392b', fontSize: '15px' }); }

  // ---------- onderste paneel: tellers of kostprijs
  const cp = $('#costpanel'), stats = $('#stats');
  if (st.cost) {
    stats.style.display = 'none'; cp.style.display = 'block';
    const g = ease(clamp(p * 1.6));
    if (today) {
      cp.innerHTML = `<div style="font-size:24px;color:#5f6b73">Wat kostte deze order?</div><div style="font-size:72px;font-weight:700;color:#c0392b;margin-top:6px;opacity:${g}">€ ???</div><div style="font-size:22px;color:#5f6b73;margin-top:8px;opacity:${g}">Alleen de montage is terug te vinden. Inkoop zonder nummer, voorraad niet afgeboekt, roosters kwijt.</div>`;
    } else {
      let acc = 0; const total = COST.reduce((a, c) => a + c[1], 0), sale = 9950, scale = 1700 / sale;
      const segs = COST.map((c, i) => { const w = c[1] * scale * clamp(g * 4 - i * .7); const h = `<div class="seg" style="left:${acc}px;width:${w}px;background:${c[2]}"></div><div class="seglab" style="left:${acc}px;opacity:${clamp(g * 4 - i * .7)}">${c[0]}<br><b style="color:#202020">${eur(c[1])}</b></div>`; acc += c[1] * scale; return h; }).join('');
      const mw = (sale - total) * scale * clamp(g * 4 - 2.8);
      cp.innerHTML = `<div style="font-size:24px;color:#5f6b73">Wat kostte deze order? <b style="color:#1c4e5c;font-size:34px">&nbsp;${eur(total * clamp(g * 1.4))}</b> &nbsp;·&nbsp; marge <b style="color:#1e8a4c;font-size:34px">${eur((sale - total) * clamp(g * 4 - 2.8))} (35%)</b></div>${segs}<div class="seg" style="left:${acc}px;width:${mw}px;background:#e4a11b"></div><div class="seglab" style="left:${acc}px;opacity:${clamp(g * 4 - 2.8)}">Marge van de order<br><b style="color:#202020">${eur(sale - total)}</b></div>`;
    }
  } else {
    cp.style.display = 'none'; stats.style.display = 'block';
    const hand = today ? (ph.i >= 1 ? 1 : 0) + (ph.i >= 5 ? 1 : 0) + (ph.i >= 3 ? 1 : 0) : 0;
    const lost = today && (ph.i > 2 || (ph.i === 2 && p > .5)) ? 1 : 0;
    const diff = today && (ph.i > 4 || (ph.i === 4 && p > .4)) ? 56 : 0;
    const items = [['Met de hand overgetikt', hand + '×', today ? 'tussen systemen' : 'alles gaat vanzelf', hand ? '#c0392b' : '#1e8a4c'],
      ['Regels kwijt', String(lost), today ? 'onderweg naar Exact' : 'alle regels komen aan', lost ? '#c0392b' : '#1e8a4c'],
      ['Voorraadverschil', diff ? diff + ' m' : '0', 'administratie vs. magazijn', diff ? '#c0392b' : '#1e8a4c'],
      ['Kostprijs bekend', today ? 'nee' : (ph.i >= 2 ? 'ja' : '…'), today ? 'alleen een schatting' : 'per order, via het KKN', today ? '#c0392b' : '#1e8a4c']];
    stats.innerHTML = items.map((it, k) => `<div class="stat" style="left:${k * 450}px"><div class="l">${it[0]}</div><div class="v" style="color:${it[3]}">${it[1]}</div><div class="s">${it[2]}</div></div>`).join('');
  }
}

// ---------- afspelen en schalen ----------
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); $('#stage').style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();
let t0 = performance.now(), paused = false, tPause = 0;
const now = () => paused ? tPause : (performance.now() - t0) / 1000 % T_END;
function loop() { const t = now(); draw(t); $('#bar i').style.width = (t / T_END * 100) + '%'; $('#tm').textContent = Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'); if (!window.REC) requestAnimationFrame(loop); }
$('#pp').onclick = () => { if (paused) { t0 = performance.now() - tPause * 1000; paused = false; $('#pp').textContent = '❚❚'; } else { tPause = now(); paused = true; $('#pp').textContent = '►'; } };
$('#bar').onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); const t = (e.clientX - r.left) / r.width * T_END; t0 = performance.now() - t * 1000; if (paused) tPause = t; };
$('#fs').onclick = () => document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); $('#pp').click(); } if (e.code === 'ArrowRight') { t0 -= STEP * 1000; } if (e.code === 'ArrowLeft') { t0 += STEP * 1000; } });
window.drawAt = (t) => { window.REC = true; document.body.classList.add('rec'); draw(t); };
window.DURATION = T_END;
requestAnimationFrame(loop);
</script>
</body>
