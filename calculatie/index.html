<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kozijncalculatie · demo</title>
<style>
:root{--chrome:#e9edf2;--line:#c7ced8;--sel:#cce4f7;--selb:#0078d4;--txt:#1b1f24;--soft:#5a6470}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#8b97a6;font:12.5px/1.4 "Segoe UI",Tahoma,Arial,sans-serif;color:var(--txt);padding:14px 14px 76px}
.win{background:#fff;border:1px solid #6e7b8b;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;height:calc(100vh - 90px);min-height:560px}
.title{background:#2c4a6e;color:#fff;display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:12.5px}
.title .ic{width:16px;height:16px;background:#f2b134;border-radius:2px;display:inline-block}
.title .ctl{margin-left:auto;display:flex;gap:2px}.title .ctl span{width:28px;text-align:center;opacity:.85}
.mb{display:flex;gap:2px;background:var(--chrome);border-bottom:1px solid var(--line);padding:1px 4px}
.mb span{padding:3px 8px;cursor:default}.mb span:hover{background:#dbe3ec}
.tb{display:flex;gap:2px;align-items:center;background:linear-gradient(#f7f9fb,#e9edf2);border-bottom:1px solid var(--line);padding:4px 6px;flex-wrap:wrap}
.tb button{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:62px;padding:3px 6px;border:1px solid transparent;background:none;font:11.5px "Segoe UI",Tahoma,Arial;color:var(--txt);cursor:pointer;border-radius:2px}
.tb button b{font-size:17px;line-height:20px;font-weight:400}
.tb button:hover:not(:disabled){background:#dcecf9;border-color:#9cc7ea}.tb button:disabled{opacity:.4;cursor:default}
.tb button.hl{background:#fff4d6;border-color:#e8c46a}
.tb .sep{width:1px;height:38px;background:var(--line);margin:0 4px}
.body{flex:1;display:grid;grid-template-columns:290px minmax(0,1fr) 250px;min-height:0}
.tree{border-right:1px solid var(--line);overflow:auto;background:#fbfcfd;padding:4px 0}
.tree .h{font-weight:600;padding:4px 8px;color:var(--soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.tree a{display:flex;gap:6px;align-items:center;padding:2px 8px 2px 18px;color:var(--txt);text-decoration:none;white-space:nowrap;cursor:pointer}
.tree a:hover{background:#eef4fb}.tree a.on{background:var(--sel);outline:1px dotted var(--selb)}
.tree .st{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;gap:1px;background:var(--chrome);border-bottom:1px solid var(--line);padding:4px 6px 0}
.tabs a{padding:4px 12px;border:1px solid var(--line);border-bottom:0;background:#f2f4f7;cursor:pointer;color:var(--txt);text-decoration:none;margin-bottom:-1px}
.tabs a.on{background:#fff;font-weight:600}
.pane{flex:1;overflow:auto;padding:10px}
.side{border-left:1px solid var(--line);overflow:auto;background:#fbfcfd}
.grp{border-bottom:1px solid var(--line)}.grp h4{margin:0;padding:5px 8px;background:var(--chrome);font-size:12px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:3px 6px;padding:6px 8px}.kv span:nth-child(odd){color:var(--soft)}
table.g{width:100%;border-collapse:collapse;font-size:12.5px}
.g th{background:var(--chrome);border:1px solid var(--line);padding:3px 6px;text-align:left;font-weight:600;white-space:nowrap}
.g td{border:1px solid #e3e7ec;padding:3px 6px}.g tr:nth-child(even) td{background:#f8fafc}.g .n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:0 5px;border-radius:2px;font-size:11px}.t1{background:#e8edf3}.t2{background:#dceefc}.t3{background:#fff1cc}
.status{display:flex;gap:16px;background:var(--chrome);border-top:1px solid var(--line);padding:3px 8px;font-size:11.5px;color:var(--soft)}
.status b{color:var(--txt);font-weight:600}
.opm{border:1px solid #9aa5b1;max-width:760px;font-family:Consolas,"Courier New",monospace;font-size:12px}
.opm .hd{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #9aa5b1}.opm .hd div{padding:6px 8px;border-right:1px solid #c9d0d8}
.opm .hd small{display:block;color:var(--soft);font-family:"Segoe UI",Arial;font-size:10.5px}
.note{margin:8px 0;padding:6px 10px;border:1px solid;font-size:12.5px}.note.w{background:#fff8e1;border-color:#e8c46a}.note.ok{background:#eaf7ee;border-color:#9fd3ae}.note.e{background:#fdecea;border-color:#efa59c}
.drawing{background:#fff;border:1px solid #e3e7ec}
.xlink{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border:1px solid var(--line);background:#fff;color:var(--selb);text-decoration:none;border-radius:2px}.xlink:hover{background:#eef4fb}
.empty{color:var(--soft);padding:30px;text-align:center}
@media(max-width:1000px){.body{grid-template-columns:1fr}.tree,.side{display:none}body{padding:6px 6px 76px}}
</style>
</head>
<body data-site="calc">
<div class="win">
 <div class="title"><span class="ic"></span><span id="ttl">Kozijncalculatie</span><span class="ctl"><span>–</span><span>□</span><span>✕</span></span></div>
 <div class="mb"><span>Bestand</span><span>Bewerken</span><span>Beeld</span><span>Offerte</span><span>Productie</span><span>Extra</span><span>Venster</span><span>Help</span></div>
 <div class="tb" id="tb"></div>
 <div class="body">
  <div class="tree" id="tree"></div>
  <div class="center"><div class="tabs" id="tabs"></div><div class="pane" id="pane"></div></div>
  <div class="side" id="side"></div>
 </div>
 <div class="status" id="sb"></div>
</div>
<script src="../shared/store.js"></script>
<script>
const {eur}=KKN,eur2=KKN.eur2;const $=s=>document.querySelector(s);
let cur=sessionStorage.getItem('demo-calc')||'AR-2026-118',tab=sessionStorage.getItem('demo-calc-tab')||'tekening';
const TABS=[['tekening','Tekening'],['posities','Posities'],['stuklijst','Stuklijst'],['productie','Productie (OPM)'],['export','Export']];
const KIND={backflush:['Voorraad – backflush','t1'],perorder:['Voorraad – per order','t2'],inkoop:['Inkoop op order','t3']};
const sel=id=>{cur=id;sessionStorage.setItem('demo-calc',id);history.replaceState(null,'','#/'+id);render()};
const setTab=t=>{tab=t;sessionStorage.setItem('demo-calc-tab',t);render()};
function tree(){const s=KKN.state;const offs=s.orders.filter(o=>!o.kkn&&o.status!=='geaccepteerd'),acc=s.orders.filter(o=>!o.kkn&&o.status==='geaccepteerd'),ords=s.orders.filter(o=>o.kkn);
 const lab=o=>o.kkn?(o.factory==='in_productie'?['In productie','#e8a317']:['Gereed','#2e9d55']):o.status==='geaccepteerd'?['Akkoord','#0078d4']:['Offerte','#8a96a3'];
 const item=o=>{const l=lab(o);return `<a class="${o.id===cur?'on':''}" onclick="sel('${o.id}')"><span class="st" style="background:${l[1]}"></span><span style="overflow:hidden;text-overflow:ellipsis">${o.kkn?o.kkn+' · ':''}${o.id} <span style="color:#5a6470">${o.klant}</span></span><span style="margin-left:auto;font-size:10.5px;color:#fff;background:${l[1]};border-radius:2px;padding:0 4px">${l[0]}</span></a>`};
 return `<div class="h">Offertes</div>${offs.map(item).join('')||'<div style="padding:2px 18px;color:#5a6470">geen</div>'}
 <div class="h" style="margin-top:8px">Akkoord · klaar voor werkvoorbereiding</div>${acc.map(item).join('')||'<div style="padding:2px 18px;color:#5a6470">geen</div>'}
 <div class="h" style="margin-top:8px">Productieorders (KKN)</div>${ords.map(item).join('')}`}
function toolbar(o){const can=o&&o.status==='geaccepteerd'&&!o.kkn,ready=o&&o.factory==='in_productie';
 return `<button onclick="sel(KKN.A.nieuweOfferte())"><b>🗋</b>Nieuw</button><button disabled><b>📂</b>Openen</button><button disabled><b>💾</b>Opslaan</button><span class="sep"></span>
 <button onclick="setTab('posities')"><b>▦</b>Positie</button><button onclick="setTab('tekening')"><b>⬚</b>Tekenen</button><button onclick="setTab('stuklijst')"><b>☰</b>Stuklijst</button><button onclick="alert('Prijs berekend: '+KKN.eur(KKN.find(cur).excl)+' excl. btw')"><b>∑</b>Prijs</button><button onclick="window.print()"><b>🖶</b>Afdrukken</button><span class="sep"></span>
 <button class="${can?'hl':''}" ${can?'':'disabled'} onclick="KKN.A.vrijgeven(cur);setTab('productie')" title="Werkvoorbereiding: KKN-nummer aanmaken en order naar de fabriek"><b>⚙</b>Vrijgeven<br>productie</button>
 <button class="${ready?'hl':''}" ${ready?'':'disabled'} onclick="KKN.A.gereed(cur)" title="Productie meldt de order gereed"><b>✔</b>Gereed-<br>melden</button>
 <button onclick="setTab('export')"><b>⇄</b>Export</button>`}
function frame(o){// voorgevel van één kozijn: draai-kiep met hor, vast glas, rooster
 const W=1800,H=1500,s=0.26,x0=40,y0=30,w=W*s,h=H*s,t=68*s;const col=o.lines.find(l=>l.art==='PRF-A')?'#3a3f45':'#f4f4f2';
 return `<svg class="drawing" viewBox="0 0 ${w+140} ${h+110}" width="100%" style="max-width:640px">
 <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#3a3f45" stroke="#222"/><rect x="${x0+t}" y="${y0+t}" width="${w-2*t}" height="${h-2*t}" fill="#fff" stroke="#222"/>
 <rect x="${x0+t}" y="${y0+t}" width="${w-2*t}" height="${22}" fill="#9aa5b1" stroke="#222"/><text x="${x0+w/2}" y="${y0+t+15}" font-size="10" text-anchor="middle" fill="#fff">ventilatierooster</text>
 <line x1="${x0+w*0.48}" y1="${y0+t+22}" x2="${x0+w*0.48}" y2="${y0+h-t}" stroke="#3a3f45" stroke-width="${t}"/>
 <rect x="${x0+t+6}" y="${y0+t+28}" width="${w*0.48-t-t/2-12}" height="${h-2*t-34}" fill="#dbeefa" stroke="#222"/>
 <polyline points="${x0+t+6},${y0+t+28} ${x0+w*0.48-t/2-6},${y0+h/2+10} ${x0+t+6},${y0+h-t-6}" fill="none" stroke="#555" stroke-dasharray="5 4"/>
 <polyline points="${x0+t+6},${y0+h-t-6} ${x0+(w*0.48)/2},${y0+t+28} ${x0+w*0.48-t/2-6},${y0+h-t-6}" fill="none" stroke="#555" stroke-dasharray="2 3"/>
 <rect x="${x0+t+12}" y="${y0+t+34}" width="${w*0.48-t-t/2-24}" height="${h-2*t-46}" fill="url(#hor)" opacity=".5"/>
 <rect x="${x0+w*0.48+t/2+6}" y="${y0+t+28}" width="${w*0.52-t-t/2-12}" height="${h-2*t-34}" fill="#dbeefa" stroke="#222"/><text x="${x0+w*0.74}" y="${y0+h/2+16}" font-size="12" text-anchor="middle" fill="#3a5a78">V</text>
 <defs><pattern id="hor" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0H4M0 0V4" stroke="#666" stroke-width=".4"/></pattern></defs>
 <line x1="${x0}" y1="${y0+h+24}" x2="${x0+w}" y2="${y0+h+24}" stroke="#c0392b"/><text x="${x0+w/2}" y="${y0+h+40}" font-size="12" text-anchor="middle" fill="#c0392b">${W}</text>
 <line x1="${x0+w+24}" y1="${y0}" x2="${x0+w+24}" y2="${y0+h}" stroke="#c0392b"/><text x="${x0+w+30}" y="${y0+h/2}" font-size="12" fill="#c0392b">${H}</text>
 <text x="${x0}" y="${y0+h+70}" font-size="11" fill="#5a6470">Pos. 1 · draai-kiep met hor (links), vast glas HR++ (rechts), rooster boven · kleur ${o.lines.find(l=>l.art==='PRF-A')?'antraciet buiten / wit binnen':'wit'}</text></svg>`}
function posities(o){const n=o.posities;const types=['Draai-kiep + vast','Vast glas','Deur met zijlicht','Draai-kiep','Schuifpui','Bovenlicht'];
 let tot=0;const rows=Array.from({length:n},(_,i)=>{const p=Math.round(o.excl/n*(0.8+0.4*((i*37)%10)/10));tot+=p;return [i+1,types[i%types.length],(1200+(i*170)%900)+' × '+(1100+(i*230)%700),i%3===0?'antraciet/wit':'wit',1,p]});
 rows[n-1][5]+=o.excl-tot;
 return `<table class="g"><thead><tr><th>Pos.</th><th>Type</th><th>Maten (b × h)</th><th>Kleur</th><th class="n">Aantal</th><th class="n">Prijs</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="n">${r[4]}</td><td class="n">${eur2(r[5])}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="5"><b>Totaal excl. btw</b></td><td class="n"><b>${eur2(o.excl)}</b></td></tr></tfoot></table>`}
function stuklijst(o){return `<table class="g"><thead><tr><th>Groep</th><th>Artikel</th><th>Omschrijving</th><th class="n">Aantal</th><th>Afboeken / inkoop</th><th class="n">Kostprijs</th><th></th></tr></thead><tbody>${o.lines.map(l=>`<tr><td>${l.group}</td><td>${l.art}</td><td>${l.omschr}</td><td class="n">${l.qty} ${l.unit}</td><td><span class="tag ${KIND[l.kind][1]}">${KIND[l.kind][0]}</span>${l.supplier?' · '+l.supplier:''}</td><td class="n">${eur2(l.cost)}</td><td>${o.exact.fabOrder?(o.exact.fabOrder.find(x=>x.art===l.art)?`<a class="xlink" href="../boekhouding/index.html#/fo/${o.id}">in boekhouding ↗</a>`:'<span style="color:#a3271a">ontbreekt in boekhouding</span>'):''}</td></tr>`).join('')}
 <tr><td>Arbeid</td><td>UREN</td><td>Fabrieksuren</td><td class="n">${o.hours} u</td><td><span class="tag t1">Urenregistratie</span></td><td class="n">${eur2(o.hours*o.rate)}</td><td>${o.exact.hoursBooked?`<a class="xlink" href="../boekhouding/index.html#/fo/${o.id}">in boekhouding ↗</a>`:''}</td></tr></tbody><tfoot><tr><td colspan="5"><b>Kostprijs fabriek (voorcalculatie)</b></td><td class="n"><b>${eur2(o.lines.reduce((a,l)=>a+l.cost,0)+o.hours*o.rate)}</b></td><td>${o.kkn?`<a class="xlink" href="../boekhouding/index.html#/kostprijs/${o.id}">nacalculatie ↗</a>`:''}</td></tr></tfoot></table>
 <p style="color:#5a6470">Per regel staat vast hoe het materiaal de deur uitgaat: standaardmateriaal via backflush bij de gereedmelding, duur materiaal per order bij uitgifte, en maatwerk via een inkooporder op het KKN.</p>`}
function productie(o){const s=KKN.state;
 if(!o.kkn)return `${o.status!=='geaccepteerd'?'<div class="note w">Deze offerte is nog niet akkoord. De verkoper zet de klant op akkoord in het CRM; daarna kan de werkvoorbereiding vrijgeven.</div>':'<div class="note ok">Akkoord ontvangen. Klik op <b>Vrijgeven productie</b>: het KKN-nummer wordt aangemaakt en de order gaat naar de fabriek.</div>'}<div class="empty">Nog geen productieorder.</div>`;
 return `${o.exact.missing&&o.exact.missing.length?`<div class="note e"><b>Export onvolledig:</b> ${o.exact.missing.join(', ')} niet in de boekhouding aangekomen.</div>`:''}
 <div class="opm"><div class="hd"><div><small>KKN-nummer</small><b>${o.kkn}</b></div><div><small>Offerte</small>${o.id}</div><div><small>Vestiging</small>${o.adm} ${o.vest}</div><div><small>Status</small>${o.factory==='in_productie'?'IN PRODUCTIE':'GEREED'}</div></div>
 <div style="padding:8px">ORDERPRODUCTIEMAP (OPM)<br>Klant: ${o.klant}, ${o.adres}, ${o.plaats}<br>Posities: ${o.posities} · Leverweek: 2026-W51<br><br>${o.lines.map(l=>`${l.art.padEnd(7,' ').replace(/ /g,'&nbsp;')} ${String(l.qty).padStart(4,' ').replace(/ /g,'&nbsp;')} ${l.unit.padEnd(4,' ').replace(/ /g,'&nbsp;')} ${l.omschr}`).join('<br>')}<br>UREN&nbsp;&nbsp;&nbsp; ${o.hours} u&nbsp;&nbsp; Fabrieksuren</div></div>
 <p>${o.factory==='in_productie'?'Als de fabriek klaar is: <b>Gereedmelden</b>. Dan wordt het standaardmateriaal afgeboekt en worden de uren op het KKN geboekt.':'Gereed gemeld.'}</p>`}
function exportTab(o){const s=KKN.state;const mine=s.log.filter(l=>l.msg.includes(o.id)||(o.kkn&&l.msg.includes(o.kkn)));
 return `<div class="note ${s.koppeling?'ok':'w'}">${s.koppeling?'Koppeling actief: elke stap gaat direct naar de boekhouding en het CRM, met offertenummer en KKN.':'Oude export: draait één keer per nacht, neemt niet alle regels mee (roosters vallen weg) en kent geen inkoop of gereedmelding.'}</div>
 <table class="g"><thead><tr><th>Tijd</th><th>Naar</th><th>Bericht</th></tr></thead><tbody>${mine.map(l=>`<tr style="${l.ok?'':'color:#a3271a'}"><td>${l.t}</td><td>${l.to||'—'}</td><td>${l.msg}</td></tr>`).join('')||'<tr><td colspan="3">Nog niets verstuurd voor deze order.</td></tr>'}</tbody></table>`}
function side(o){return `<div class="grp"><h4>Openen in</h4><div style="padding:6px 8px">${KKN.links(o,'..','calc')}</div></div><div class="grp"><h4>Offerte</h4><div class="kv"><span>Offertenr.</span><span>${o.id}</span><span>KKN</span><span>${o.kkn||'—'}</span><span>Status</span><span><b style="color:${o.kkn?'#1b1f24':o.status==='geaccepteerd'?'#0078d4':'#5a6470'}">${o.kkn?(o.factory==='in_productie'?'In productie':'Gereed'):o.status==='geaccepteerd'?'Akkoord klant ('+(o.decided||'').split('-').reverse().join('-')+')':'Offerte'}</b></span><span>Datum</span><span>${o.date.split('-').reverse().join('-')}</span></div></div>
 <div class="grp"><h4>Klant</h4><div class="kv"><span>Naam</span><span>${o.klant}</span><span>Adres</span><span>${o.adres}</span><span>Plaats</span><span>${o.pc} ${o.plaats}</span><span>Bouwjaar</span><span>${o.bouwjaar}</span></div></div>
 <div class="grp"><h4>Verkoop</h4><div class="kv"><span>Vestiging</span><span>${o.adm} ${o.vest}</span><span>Adviseur</span><span>${o.adviseur}</span><span>Posities</span><span>${o.posities}</span><span>Prijs excl.</span><span><b>${eur2(o.excl)}</b></span></div></div>`}
function render(){const s=KKN.state;let o=KKN.find(cur);if(!o){o=s.orders[0];cur=o.id}
 $('#ttl').textContent=`Kozijncalculatie — ${o.kkn?'Productieorder '+o.kkn+' · ':''}Offerte ${o.id} · ${o.klant}`;
 $('#tb').innerHTML=toolbar(o);$('#tree').innerHTML=tree();
 $('#tabs').innerHTML=TABS.map(([k,l])=>`<a class="${k===tab?'on':''}" onclick="setTab('${k}')">${l}</a>`).join('');
 $('#pane').innerHTML=tab==='tekening'?frame(o):tab==='posities'?posities(o):tab==='stuklijst'?stuklijst(o):tab==='productie'?productie(o):exportTab(o);
 $('#side').innerHTML=side(o);
 $('#sb').innerHTML=`<span>Gebruiker: <b>werkvoorbereiding</b></span><span>Database: <b>KKN-PROD (demo)</b></span><span>Export naar boekhouding: <b style="color:${s.koppeling?'#1e7a3c':'#a3271a'}">${s.koppeling?'koppeling actief':'oud script'}</b></span>`}
const fromHash=()=>{const [id,t]=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/');if(id&&KKN.find(id)){cur=id;sessionStorage.setItem('demo-calc',id)}if(t&&TABS.some(x=>x[0]===t)){tab=t;sessionStorage.setItem('demo-calc-tab',t)}};
window.addEventListener('hashchange',()=>{fromHash();render()});fromHash();
KKN.on(render);render();
</script>
<script src="../shared/bar.js"></script>
</body>
</html>
